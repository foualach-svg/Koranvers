name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk KoranVers.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KoranVers-apk
          path: KoranVers.apk
      - name: Publiceer als release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KoranVers (laatste versie)
          body: Download KoranVers.apk hieronder en open het op je Android-gsm.
          files: KoranVers.apk
          make_latest: true
